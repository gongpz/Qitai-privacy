<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="900" height="300" rx="16" fill="#faf6ef"/>
  <text x="36" y="34" font-size="20" font-weight="700" fill="#2b2013">四步上手：从加锁到阅读</text>
  <text x="864" y="34" text-anchor="end" font-size="12.5" fill="#5a4a35">右键加锁 → 验密 → 显示正文</text>

  <!-- 卡片 1 -->
  <rect x="36" y="58" width="186" height="152" rx="14" fill="#ffffff" stroke="#efe7d8"/>
  <circle cx="60" cy="86" r="13" fill="#fdf0db"/>
  <text x="60" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">1</text>
  <rect x="52" y="104" width="40" height="40" rx="10" fill="#fdf0db"/>
  <path d="M 62,122 L 62,118 A 8,8 0 0 1 78,118 L 78,122" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="58" y="122" width="24" height="16" rx="4" fill="#e8890c"/>
  <circle cx="70" cy="129" r="2.5" fill="#ffffff"/>
  <text x="52" y="170" font-size="15" font-weight="600" fill="#2b2013">右键加锁</text>
  <text x="52" y="190" font-size="11.5" fill="#5a4a35">文档树 / 正文右键</text>
  <text x="52" y="206" font-size="11.5" fill="#5a4a35">选择「设置隐私锁」</text>

  <!-- 卡片 2 -->
  <rect x="250" y="58" width="186" height="152" rx="14" fill="#ffffff" stroke="#efe7d8"/>
  <circle cx="274" cy="86" r="13" fill="#fdf0db"/>
  <text x="274" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">2</text>
  <rect x="266" y="104" width="40" height="40" rx="10" fill="#fdf0db"/>
  <circle cx="278" cy="117" r="6" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <path d="M 282,121 L 294,133 M 290,131 L 290,125 M 294,133 L 298,129" fill="none" stroke="#e8890c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="266" y="170" font-size="15" font-weight="600" fill="#2b2013">设置密码与模式</text>
  <text x="266" y="190" font-size="11.5" fill="#5a4a35">输入密码并选模式</text>
  <text x="266" y="206" font-size="11.5" fill="#5a4a35">密码可见 或 隐藏</text>

  <!-- 卡片 3 -->
  <rect x="464" y="58" width="186" height="152" rx="14" fill="#ffffff" stroke="#efe7d8"/>
  <circle cx="488" cy="86" r="13" fill="#fdf0db"/>
  <text x="488" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">3</text>
  <rect x="480" y="104" width="40" height="40" rx="10" fill="#fdf0db"/>
  <rect x="488" y="110" width="24" height="29" rx="3" fill="#ffffff" stroke="#c9bda9" stroke-width="1.5"/>
  <rect x="488" y="121" width="24" height="9" fill="#e8890c" fill-opacity="0.85"/>
  <circle cx="500" cy="125.5" r="2.6" fill="#ffffff"/>
  <text x="480" y="170" font-size="15" font-weight="600" fill="#2b2013">打开出现遮挡层</text>
  <text x="480" y="190" font-size="11.5" fill="#5a4a35">正文不可见不可选</text>
  <text x="480" y="206" font-size="11.5" fill="#5a4a35">先出现密码面板</text>

  <!-- 卡片 4 -->
  <rect x="678" y="58" width="186" height="152" rx="14" fill="#ffffff" stroke="#efe7d8"/>
  <circle cx="702" cy="86" r="13" fill="#fdf0db"/>
  <text x="702" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">4</text>
  <rect x="694" y="104" width="40" height="40" rx="10" fill="#e7f6ef"/>
  <circle cx="714" cy="124" r="13" fill="none" stroke="#0e9f6e" stroke-width="2.5"/>
  <path d="M 708,124 L 712,128 L 720,119" fill="none" stroke="#0e9f6e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="694" y="170" font-size="15" font-weight="600" fill="#2b2013">验证通过显示正文</text>
  <text x="694" y="190" font-size="11.5" fill="#5a4a35">遮挡层移除，正常阅读</text>
  <text x="694" y="206" font-size="11.5" fill="#5a4a35">目录递归自动放行</text>

  <!-- 箭头连接 -->
  <path d="M 228,134 L 243,134 M 239,129 L 245,134 L 239,139" fill="none" stroke="#e8890c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 442,134 L 457,134 M 453,129 L 459,134 L 453,139" fill="none" stroke="#e8890c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 656,134 L 671,134 M 667,129 L 673,134 L 667,139" fill="none" stroke="#e8890c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 递归提示条 -->
  <rect x="36" y="224" width="828" height="40" rx="10" fill="#fdf0db"/>
  <circle cx="60" cy="244" r="10" fill="#e8890c"/>
  <path d="M 56,244 L 59,247 L 64,241" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="249" font-size="12.5" fill="#5a4a35">父目录解锁后子文档自动放行；子节点可单独设密码；解锁状态仅存内存，刷新 / 重启自动上锁</text>
</svg>
