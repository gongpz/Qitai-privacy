<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="lpAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b45c"/>
      <stop offset="0.52" stop-color="#e8890c"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- 深色底形成 GitHub 页面对比 -->
  <rect x="0" y="0" width="900" height="200" rx="16" fill="#0b1120"/>
  <circle cx="742" cy="96" r="164" fill="#e8890c" fill-opacity="0.06"/>
  <circle cx="628" cy="18" r="96" fill="#5b8cff" fill-opacity="0.08"/>
  <circle cx="592" cy="104" r="72" fill="none" stroke="#e8890c" stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="592" cy="104" r="48" fill="none" stroke="#e8890c" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- 左侧标题区 -->
  <text x="48" y="84" font-size="40" font-weight="700" fill="#ffffff">轻态隐私</text>
  <text x="50" y="112" font-size="14" font-weight="600" letter-spacing="3" fill="#e8890c">LIGHT PRIVACY</text>
  <text x="50" y="146" font-size="14" fill="#a99a86">给思源笔记的文档与目录加一把轻量锁 · 不侵入内核 · 不改数据库结构</text>

  <!-- 三个核心卖点徽章 -->
  <rect x="48" y="162" width="136" height="26" rx="13" fill="#141c2e" stroke="#2b3648"/>
  <circle cx="64" cy="175" r="4" fill="#e8890c"/>
  <text x="76" y="180" font-size="12" fill="#e7dcc9">轻量不侵入</text>

  <rect x="194" y="162" width="136" height="26" rx="13" fill="#141c2e" stroke="#2b3648"/>
  <circle cx="210" cy="175" r="4" fill="#5b8cff"/>
  <text x="222" y="180" font-size="12" fill="#e7dcc9">双模式保护</text>

  <rect x="340" y="162" width="136" height="26" rx="13" fill="#141c2e" stroke="#2b3648"/>
  <circle cx="356" cy="175" r="4" fill="#0e9f6e"/>
  <text x="368" y="180" font-size="12" fill="#e7dcc9">密钥可备份</text>

  <!-- 右侧文档卡 + 琥珀色锁 -->
  <rect x="660" y="40" width="200" height="120" rx="18" fill="#141c2e" stroke="#2b3648"/>
  <rect x="680" y="62" width="104" height="7" rx="3.5" fill="#2b3648"/>
  <rect x="680" y="80" width="140" height="7" rx="3.5" fill="#2b3648"/>
  <rect x="680" y="98" width="76" height="7" rx="3.5" fill="#2b3648"/>
  <circle cx="802" cy="112" r="30" fill="url(#lpAmber)"/>
  <path d="M 794,108 L 794,102 A 8,8 0 0 1 810,102 L 810,108" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="788" y="108" width="28" height="22" rx="5" fill="#ffffff"/>
  <circle cx="802" cy="117" r="3" fill="#b45309"/>
  <rect x="800.5" y="118" width="3" height="7" rx="1.5" fill="#b45309"/>
</svg>
